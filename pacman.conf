#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

[options]
# The following paths are commented out with their default values listed.
# If you wish to use different paths, be sure to update the code in
# build.sh and the Hyprland configuration appropriately.
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
# If upgrades are available for these packages ask for confirmation
# SyncFirst   = pacman
#SigLevel    = Required DatabaseOptional
SigLevel    = Required DatabaseOptional PackageOptional
#SigLevel    = Never
#LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

# NOTE: this is the default in pacman, but let's be explicit
Architecture = x86_64

# Pacman won't upgrade packages listed in IgnorePkg and members of IgnoreGroup
#IgnorePkg   =
#IgnoreGroup =

#NoUpgrade   =
#NoExtract   =

# Misc options
#UseSyslog
#Color
#NoProgressBar
CheckSpace
#VerbosePkgLists
#ParallelDownloads = 5

# By default, pacman accepts packages signed by keys that it knows about.
# As a general rule, it is not needed to change the default settings for
# SigLevel, since the repository maintainers ensure that their packages are
# properly signed. However, in some cases, you might want to disable
# signature verification, so here is how to do it:
#SigLevel = Never

#[custom]
#Server = file:///home/custompkgs


[core]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.math.princeton.edu/pub/archlinux/$repo/os/$arch
Server = https://mirrors.edge.kernel.org/archlinux/$repo/os/$arch

[extra]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.math.princeton.edu/pub/archlinux/$repo/os/$arch
Server = https://mirrors.edge.kernel.org/archlinux/$repo/os/$arch

[community]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.math.princeton.edu/pub/archlinux/$repo/os/$arch
Server = https://mirrors.edge.kernel.org/archlinux/$repo/os/$arch

[multilib]
Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
Server = https://mirror.math.princeton.edu/pub/archlinux/$repo/os/$arch
Server = https://mirrors.edge.kernel.org/archlinux/$repo/os/$arch
