---
# SAOS Agent Registration Module

# Regex for username — agents only
username-regex: '^agent[a-z]$|^agent\d{1,4}$'
realname-regex: '^Agent [A-Z]\.$|^Agent \d{1,4}$'
realname-required: true

# Don't allow root as primary user
prohibit-root-login: true
allow-weak-passwords: false

# Groups to add new users to
default-groups:
  - wheel
  - video
  - audio
  - network
  - lp
  - input
  - kvm

# Force strong password requirement
require-strong-passwords: true
password-strength-threshold: 1

# Auto-login disabled (must auth at login)
auto-login: false
