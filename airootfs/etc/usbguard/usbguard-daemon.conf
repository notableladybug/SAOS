[Configuration]
# Block all devices by default unless explicitly allowed
ImplicitPolicyTarget=block
PresentDevicePolicy=allow
PresentControllerPolicy=keep
InsertedDevicePolicy=block
RestoreControllerDeviceState=false
DeviceManagerBackend=uevent

# Logging
LogLevel=info
LogFacility=daemon

# Policy for unknown devices
UnknownDevicePolicy=block

# Use system notifications for USB alerts
UseNotification=true
