[core]
# Certainty percentage required (0-99, lower = easier to spoof)
certainty = 4.5

# Time before Howdy gives up trying to authenticate
timeout = 5

# Device to use — /dev/video0 is usually built-in webcam
# Try /dev/video2 if video0 is IR-only (some laptops have both)
device = /dev/video0

# Show a notice when Howdy is attempting recognition
detection_notice = false

# Abort if no faces were detected for X frames
no_confirmation = false

# Dark threshold — prevents auth in pitch black (0 disables)
dark_threshold = 50

# Ignore people that are looking away
ignore_snapshots = false

# Suppress the "Unknown face" error message
suppress_unknown_user_message = false

# Warn when a grayscale frame is returned by the camera
frame_width = 640
frame_height = 480
recording_plugin = opencv

[snapshots]
# Take a snapshot when face is recognized
enabled = false
