# SAOS // Hyprland Lock Screen Configuration
# File: ~/.config/hypr/hyprlock.conf
# Requires: hyprlock package (AUR)

# General settings
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Background
background {
    monitor =
    path = /usr/share/backgrounds/saos/saos-default.png
    blur_passes = 0
    contrast = 0
    brightness = 0
    vibrancy = 0
    vibrancy_darkness = 0
}

# Authorization required
label {
    monitor =
    text = AUTHORIZATION REQUIRED
    color = rgb(00ff41)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 20
    halign = center
    valign = center
    text_align = center
}

# Keyboard layout indicator
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.35
    dots_spacing = 0.15
    outer_color = rgb(00ff41)
    inner_color = rgb(00000a)
    font_color = rgb(00ff41)
    fade_on_empty = true
    placeholder_text = <i>Enter Authorization Code</i>
    hide_input = false
    check_color = rgb(00ff41)
    fail_color = rgb(ff0033)
    fail_text = <i>ACCESS DENIED — RETRY</i>
    capslock_color = rgb(ffaa00)
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -47
    halign = center
    valign = center
}

# Time label
label {
    monitor =
    text = cmd[update:30000] echo "$(date +'%Y.%m.%d // %H:%M:%S UTC')"
    color = rgb(00ff41)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 80
    halign = center
    valign = center
}

# Status messages
label {
    monitor =
    text = SYSTEM LOCKED
    color = rgb(008f22)
    font_size = 11
    font_family = JetBrains Mono
    position = 0, 40
    halign = center
    valign = center
    text_align = center
}

# Agent label
label {
    monitor =
    text = [ SAOS // SCREEN LOCKED ]
    color = rgb(003311)
    font_size = 10
    font_family = JetBrains Mono
    position = 0, -80
    halign = center
    valign = bottom
    text_align = center
}
