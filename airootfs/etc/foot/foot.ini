[main]
font=JetBrains Mono:size=12
dpi-aware=yes
pad=8x8 center

[cursor]
style=block
blink=yes
blink-rate=500

[mouse]
hide-when-typing=yes

[colors]
background=000000
foreground=00ff41

selection-foreground=000000
selection-background=00ff41

regular0=000000
regular1=ff0033
regular2=00ff41
regular3=ffaa00
regular4=005533
regular5=003311
regular6=00cc88
regular7=00ff41

bright0=003311
bright1=ff3355
bright2=33ff66
bright3=ffcc00
bright4=00aa66
bright5=008833
bright6=00ffaa
bright7=ccffcc

[url]
launch=xdg-open $url
osc8-underline=url-mode
